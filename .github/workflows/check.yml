# Runs on every pull request. All jobs here run student code, so they only get
# read access. The "PR leaderboard" workflow then puts the scores on the leaderboard.
# 1. "check": code style, tests, and that each submission has a train() function.
# 2. "find": which submission folders this pull request changes.
# 3. "score": trains those submissions and uploads their scores. Skipped if there are none.
name: Check

on:
  pull_request:
    # "closed" runs nothing here, but it lets "PR leaderboard" remove the closed PR's row.
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - name: Check code style
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run tests
        run: uv run pytest

  find:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      names: ${{ steps.find.outputs.names }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: find
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: |
          names=$(.github/scripts/changed-submissions.sh "$RANGE" | tr '\n' ' ')
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "Submissions to score: ${names:-none}"

  score:
    needs: [check, find]
    if: needs.find.outputs.names != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - uses: actions/cache/restore@v6
        with:
          path: data
          key: fashion-mnist-v1
      - name: Download Fashion-MNIST
        run: uv run python -c "from fashion import data; data.train_set(); data.test_set()"
      - name: Score submissions
        env:
          NAMES: ${{ needs.find.outputs.names }}
        run: |
          folders=()
          for name in $NAMES; do folders+=("submissions/$name"); done
          uv run score "${folders[@]}" --save pr-results
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pr-results
          path: pr-results/
          if-no-files-found: ignore
          retention-days: 7
